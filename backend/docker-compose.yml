version: '3.8'
services:
  db:
    image: postgres:16
    container_name: simple_cmdb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: simple_cmdb
      POSTGRES_USER: cmdb_user
      POSTGRES_PASSWORD: cmdb_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
